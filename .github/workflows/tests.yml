# Reusable pytest job. Must not need any secret: it also runs on pull requests.
# Never runs on its own, only called by the pipeline-* workflows.

name: Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
    - name: Checkout 🛎️
      uses: actions/checkout@v6

    # Same Python as the image (alpine:3.20 ships 3.12)
    - name: Set up Python 🐍
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: |
          requirements.txt
          requirements-tests.txt

    - name: Install requirements ⏬
      run: pip install -r requirements.txt -r requirements-tests.txt

    # No tests exist yet: pytest exits 5 when it collects nothing.
    # Accept that case until tests are added, fail on anything else.
    - name: Test with PyTest ⚙️
      run: |
        rc=0
        pytest || rc=$?
        if [ "$rc" -eq 5 ]; then
          echo "::warning::No tests collected"
          exit 0
        fi
        exit "$rc"
