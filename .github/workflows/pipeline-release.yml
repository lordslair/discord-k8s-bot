# Release pipeline, run on push of a v* tag (e.g. v1.2.3).
# Lint + tests, then builds and pushes {{version}}, {{major}}.{{minor}}, short SHA and latest.

name: Pipeline Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# Releases run one at a time, so an older tag can never push latest after a newer one.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  tests:
    uses: ./.github/workflows/tests.yml

  build-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    needs:
    - lint
    - tests

    steps:
    - name: Checkout 🛎️
      uses: actions/checkout@v6

    - name: Log in to Docker Hub 🔐
      uses: docker/login-action@v3
      with:
        username: ${{ vars.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extracting Metadata 🔧
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ vars.DOCKER_USERNAME }}/${{ github.event.repository.name }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix=,suffix=,format=short
          type=raw,value=latest

    - name: Set up Docker Buildx 🐳
      uses: docker/setup-buildx-action@v3

    # Read-only cache: a tag's cache could only be reused by that same tag,
    # so reuse the one master's edge builds already filled.
    - name: Build 🏗️ & Push to Docker Hub 🚀
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        # Shown by the app (e.g. 1.2.3 or edge, and the commit SHA)
        build-args: |
          VERSION=${{ steps.meta.outputs.version }}
          COMMIT=${{ github.sha }}
        cache-from: type=gha
