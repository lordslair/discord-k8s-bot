# Reusable flake8 job: fails on Python syntax errors and undefined names.
# Never runs on its own, only called by the pipeline-* workflows.

name: Lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
    - name: Checkout 🛎️
      uses: actions/checkout@v6

    # Same Python as the image (alpine:3.20 ships 3.12)
    - name: Set up Python 🐍
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: requirements-lint.txt

    - name: Install requirements ⏬
      run: pip install -r requirements-lint.txt

    - name: Lint with flake8 📝
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
