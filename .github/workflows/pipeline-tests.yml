# Lint + tests + image build on every push / PR to master.
# Only pushes to master publish the image (tags: edge, short SHA).
# workflow_dispatch runs a dry run (no push) on any branch.

name: Pipeline Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

# PRs and dry runs: a new run cancels the previous one.
# master pushes: queued, never cancelled, so an older run can never push edge after a newer one.
# event_name is in the group so a dry run on master never replaces a queued master push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  tests:
    uses: ./.github/workflows/tests.yml

  build-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    needs:
    - lint
    - tests

    steps:
    - name: Checkout 🛎️
      uses: actions/checkout@v7

    # Only pushes publish: PRs (incl. Dependabot/forks) have no Docker Hub secret
    - name: Log in to Docker Hub 🔐
      if: github.event_name == 'push'
      uses: docker/login-action@v4
      with:
        username: ${{ vars.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extracting Metadata 🔧
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ vars.DOCKER_USERNAME }}/${{ github.event.repository.name }}
        tags: |
          type=sha,prefix=,suffix=,format=short
          type=edge

    - name: Set up Docker Buildx 🐳
      uses: docker/setup-buildx-action@v4

    # cache-to on every run keeps master's cache warm for the next builds and releases
    - name: Build 🏗️ & Push to Docker Hub 🚀
      uses: docker/build-push-action@v7
      with:
        context: .
        push: ${{ github.event_name == 'push' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        # Shown by the app (e.g. 1.2.3 or edge, and the commit SHA)
        build-args: |
          VERSION=${{ steps.meta.outputs.version }}
          COMMIT=${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
