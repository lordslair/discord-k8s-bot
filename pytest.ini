[pytest]
pythonpath = code
testpaths = tests
# py-cord (up to 2.8.1 and its master branch) still calls asyncio.iscoroutinefunction,
# deprecated in Python 3.14 and due for removal in 3.16. Remove once py-cord fixes it.
filterwarnings =
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:discord.*
